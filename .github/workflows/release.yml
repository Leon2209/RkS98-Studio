name: Linux builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  debian:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/native/requirements.txt
      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libudev1 desktop-file-utils dpkg
      - name: Install release build dependencies
        run: |
          python -m pip install -r packaging/native/requirements.txt
          python -m pip install -e '.[dev]'
      - name: Check release tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python -c "import os, tomllib; version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match pyproject.toml version'"
      - name: Validate source
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest -q
          desktop-file-validate packaging/rks98.desktop
      - name: Build native package payloads
        run: python packaging/build_linux.py
      - name: Install and verify Debian package
        run: |
          sudo apt-get install -y ./dist/*.deb
          dpkg-query -W rks98-studio
          rks98 --help
          rks98 --packaging-smoke-test
          test -r /usr/lib/udev/rules.d/70-rks98.rules
          desktop-file-validate /usr/share/applications/rks98.desktop
          sudo apt-get remove -y rks98-studio
          test ! -e /usr/bin/rks98
      - uses: actions/upload-artifact@v4
        with:
          name: linux-debian-package
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: internal-arch-build-input
          path: build/native/arch-kit.tar.gz
          if-no-files-found: error

  arch:
    needs: debian
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: internal-arch-build-input
          path: input
      - name: Build, install, and remove native Arch package
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pacman -Syu --noconfirm --needed sudo
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          mkdir kit dist
          tar -xzf input/arch-kit.tar.gz -C kit --strip-components=1
          chown -R builder:builder kit
          cd kit
          runuser -u builder -- makepkg --syncdeps --noconfirm
          cp *.pkg.tar.zst ../dist/
          pacman -U --noconfirm *.pkg.tar.zst
          runuser -u builder -- rks98 --help
          runuser -u builder -- rks98 --packaging-smoke-test
          pacman -R --noconfirm rks98-studio
          test ! -e /usr/bin/rks98
          cd ../dist
          sha256sum *.pkg.tar.zst > arch-package.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arch-package
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [debian, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*-package
          merge-multiple: true
          path: dist
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --draft --title "RK-S98 Studio $TAG" --generate-notes
