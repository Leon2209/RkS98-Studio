name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libudev1 desktop-file-utils
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Validate application packaging
        run: |
          desktop-file-validate packaging/rks98.desktop
          bash -n packaging/arch/PKGBUILD.in
      - name: Test without hardware
        run: python -m pytest -q
      - name: Build source and wheel distributions
        run: python -m build
      - name: Smoke-test installed wheel outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$(mktemp -d)"
          python -m rks98 --help
          python -c "from importlib.resources import files; from rks98.gui import MainWindow; assert files('rks98').joinpath('assets/keyboard_rk-s98.png').is_file()"
